name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (host build)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --target SysConTests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure ControllerLib standalone
        run: cmake -S src/controllerlib -B build-controllerlib -G Ninja

      - name: Build ControllerLib standalone
        run: cmake --build build-controllerlib

  build:
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # full history + tags so the Makefile's `git describe` works

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Only the release libnx.a: sys-con links -lnx, and `make install` would also build the
      # unused debug libnxd.a (half the time). The copies are libnx's own `install` recipe.
      - name: Install libnx
        working-directory: external/libnx/nx
        run: |
          make -j"$(nproc)" lib/libnx.a
          cp default_icon.jpg switch_rules switch.ld switch.specs "$DEVKITPRO/libnx/"
          cp -r include lib "$DEVKITPRO/libnx/"
          cp -r external/bsd/include "$DEVKITPRO/libnx/"

      - name: Build and assemble release tree
        run: make all -j"$(nproc)"

      - name: Compute version (same logic as the Makefile)
        id: version
        run: |
          GIT_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          COUNT=$(git rev-list "$(git rev-list --tags --no-walk --max-count=1)"..HEAD --count)
          VERSION="$GIT_TAG"
          [ "$COUNT" != "0" ] && VERSION="$GIT_TAG+$COUNT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sys-con-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: sys-con-${{ github.ref_name }}
          path: out/

      - name: Zip
        run: cd out && zip -r "../sys-con-${{ github.ref_name }}.zip" .

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "sys-con-${{ github.ref_name }}.zip"
          --repo "${{ github.repository }}" --draft --title "v${{ github.ref_name }}" --generate-notes
